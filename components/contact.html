                        <div class="row g-3">

                            <div class="col-md-6">

                                <div class="form-group">

                                    <label class="form-label">Full Name</label>

                                    <input type="text" name="name" class="form-control" placeholder="Your Full Name"
                                        required>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="form-group">

                            </div>

                            <div class="col-md-6">

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="form-group">

                                    <label class="form-label">Subject</label>

                                    <select name="subject" class="form-control">

                                        <option>AC EV Charger Enquiry</option>
                                        <option>DC Fast Charger Enquiry</option>
                                        <option>Solar EV Solution</option>
                                        <option>OCPP Software</option>
                                        <option>AMC & Maintenance</option>
                                        <option>General Enquiry</option>

                                    </select>

                                </div>

                            </div>

                            <div class="col-12">

                                <div class="form-group">

                                    <label class="form-label">Message</label>

                                    <textarea class="form-control" name="message" rows="5"
                                        placeholder="Tell us about your EV charging project or requirement..."
                                        required></textarea>

                                </div>

                            </div>

                            <div class="col-12">

                                <button type="submit" class="btn btn-primary w-100">

                                    <i class="bi bi-send-fill me-2"></i>

                                    Send Message

                                </button>

                            </div>
